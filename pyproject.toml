[project]
name = "smart-campus-service-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-restframework>=0.0.1",
    "djangorestframework>=3.18.1",
    "dotenv>=0.9.9",
    "groq>=1.7.0",
    "pgvector>=0.5.0",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
    "pydentic>=0.0.1.dev3",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
smart-campus-service-finder = "smart_campus_service_finder:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
